<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Code Motion Director — Studio Preview</title>
  <style>
    :root {
      --bg-studio: #07090e;
      --window-bg: #0d1117;
      --window-border: rgba(255, 255, 255, 0.12);
      --text-main: #e6edf3;
      --text-muted: #7d8590;
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --accent-rose: #f43f5e;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Themes */
    [data-theme="obsidian"] {
      --window-bg: #0b0e17;
      --window-border: rgba(56, 189, 248, 0.2);
      --token-kw: #f43f5e;
      --token-fn: #38bdf8;
      --token-str: #34d399;
      --token-num: #fbbf24;
      --token-comment: #64748b;
      --token-op: #c084fc;
      --term-bg: #06080f;
    }

    [data-theme="onedark"] {
      --window-bg: #282c34;
      --window-border: rgba(255, 255, 255, 0.1);
      --token-kw: #c678dd;
      --token-fn: #61afef;
      --token-str: #98c379;
      --token-num: #d19a66;
      --token-comment: #5c6370;
      --token-op: #56b6c2;
      --term-bg: #21252b;
    }

    [data-theme="monokai"] {
      --window-bg: #272822;
      --window-border: rgba(255, 255, 255, 0.1);
      --token-kw: #f92672;
      --token-fn: #a6e22e;
      --token-str: #e6db74;
      --token-num: #ae81ff;
      --token-comment: #75715e;
      --token-op: #66d9ef;
      --term-bg: #1e1f1c;
    }

    [data-theme="cyberpunk"] {
      --window-bg: #0d0221;
      --window-border: rgba(0, 240, 255, 0.35);
      --token-kw: #ff0055;
      --token-fn: #00f0ff;
      --token-str: #ffe600;
      --token-num: #00ff66;
      --token-comment: #70587c;
      --token-op: #b800ff;
      --term-bg: #050014;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-studio);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Outer Stage Container */
    .stage-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 900px;
    }

    /* Canvas Screen Frame */
    .viewport-frame {
      position: relative;
      background: radial-gradient(circle at 50% 30%, #171d2d 0%, #080a10 80%);
      border: 1px solid var(--window-border);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .aspect-9-16 {
      width: 380px;
      height: 675px;
    }

    .aspect-16-9 {
      width: 760px;
      height: 427px;
    }

    @media (max-width: 480px) {
      .aspect-9-16 {
        width: 100%;
        max-width: 340px;
        height: 604px;
      }
      .aspect-16-9 {
        width: 100%;
        height: 220px;
      }
    }

    /* Mac Window Container */
    .code-window {
      margin: 16px;
      background: var(--window-bg);
      border: 1px solid var(--window-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      flex: 1;
      position: relative;
    }

    .window-header {
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--window-border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .traffic-lights {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .window-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .badge-lang {
      font-size: 0.65rem;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Code Body */
    .editor-body {
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.6;
      flex: 1;
      overflow-y: auto;
      position: relative;
    }

    .code-line {
      display: flex;
      align-items: baseline;
      transition: opacity 0.25s ease, filter 0.25s ease;
      white-space: pre;
    }

    .code-line.dimmed {
      opacity: 0.25;
      filter: blur(0.3px);
    }

    .code-line.focused {
      opacity: 1;
      background: rgba(56, 189, 248, 0.08);
      border-left: 2px solid var(--accent-cyan);
      margin-left: -14px;
      padding-left: 12px;
    }

    .line-num {
      width: 24px;
      color: var(--text-muted);
      opacity: 0.5;
      text-align: right;
      margin-right: 12px;
      font-size: 0.7rem;
      user-select: none;
    }

    .line-text {
      flex: 1;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 1.1em;
      background: var(--accent-cyan);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 0.9s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Callout Badges & Overlay */
    .callout-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .callout-card {
      position: absolute;
      background: rgba(13, 17, 23, 0.92);
      border: 1px solid var(--accent-purple);
      border-radius: 8px;
      padding: 6px 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 12px rgba(192, 132, 252, 0.25);
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      transform: scale(0.9) translateY(4px);
      max-width: 200px;
    }

    .callout-card.active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .callout-header {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--accent-purple);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .callout-desc {
      font-size: 0.65rem;
      color: var(--text-main);
      margin-top: 2px;
    }

    /* Terminal Drawer */
    .terminal-drawer {
      background: var(--term-bg);
      border-top: 1px solid var(--window-border);
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      max-height: 130px;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .terminal-drawer.open {
      transform: translateY(0);
    }

    .terminal-bar {
      color: var(--text-muted);
      font-size: 0.65rem;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 3px;
    }

    .term-line {
      line-height: 1.45;
      color: var(--accent-emerald);
      margin-bottom: 2px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .term-line.visible {
      opacity: 1;
    }

    /* Scrubber & Player Controls */
    .player-controls {
      width: 100%;
      margin-top: 14px;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid var(--window-border);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-ctrl {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--window-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-ctrl:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-cyan);
    }

    .scrubber-slider {
      flex: 1;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .time-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      min-width: 65px;
      text-align: right;
    }

    /* Syntax Tokens */
    .kw { color: var(--token-kw); font-weight: 700; }
    .fn { color: var(--token-fn); }
    .str { color: var(--token-str); }
    .num { color: var(--token-num); }
    .comment { color: var(--token-comment); font-style: italic; }
    .op { color: var(--token-op); }
  </style>
</head>
<body data-theme="obsidian">

  <div class="stage-wrapper">

    <!-- Viewport Frame -->
    <div class="viewport-frame aspect-9-16" id="viewport-frame">
      
      <!-- Code Window -->
      <div class="code-window">
        <!-- Window Title Bar -->
        <div class="window-header">
          <div class="traffic-lights">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
          </div>
          <div class="window-title" id="window-title">src/auth/session.ts</div>
          <div class="badge-lang" id="badge-lang">TS</div>
        </div>

        <!-- Code Editor Lines -->
        <div class="editor-body" id="editor-body"></div>

        <!-- Callouts Layer -->
        <div class="callout-overlay" id="callout-overlay"></div>

        <!-- Terminal Output Drawer -->
        <div class="terminal-drawer" id="terminal-drawer">
          <div class="terminal-bar">
            <span id="term-title">Console Output</span>
            <span>Live Stream</span>
          </div>
          <div id="terminal-lines"></div>
        </div>
      </div>

    </div>

    <!-- Timeline & Playback Scrubber -->
    <div class="player-controls">
      <button class="btn-ctrl" id="play-pause-btn">⏸ Pause</button>
      <button class="btn-ctrl" id="restart-btn">🔄 Replay</button>
      <button class="btn-ctrl" id="ratio-btn">📱 9:16</button>
      <input type="range" class="scrubber-slider" id="scrubber" min="0" max="100" value="0" step="0.1">
      <div class="time-badge" id="time-badge">0.0s / 8.0s</div>
    </div>

  </div>

  <script>
    (function() {
      'use strict';

      // --- INJECTED SPEC OR DEFAULT REFERENCE ---
      // __SPEC_PLACEHOLDER__
      const DEFAULT_SPEC = {
        "title": "src/auth/session.ts",
        "language": "typescript",
        "aspectRatio": "9:16",
        "theme": "obsidian",
        "code": [
          "async function verifyToken(token: string) {",
          "  const session = await auth.verify(token);",
          "  if (!session.isValid) {",
          "    throw new UnauthorizedError('Expired');",
          "  }",
          "  return session.user;",
          "}"
        ],
        "focusLines": [2, 4],
        "typingSpeed": 35,
        "callouts": [
          {
            "line": 2,
            "label": "Async Verifier",
            "note": "Awaits HMAC-SHA256 signature",
            "side": "right"
          },
          {
            "line": 4,
            "label": "Guard Clause",
            "note": "Throws on expired claims",
            "side": "right"
          }
        ],
        "terminal": {
          "enabled": true,
          "title": "Server Terminal (Node.js v22)",
          "commands": [
            "$ curl -X POST https://api.dev/auth/verify",
            "> Validating JWT payload token...",
            "> Signature verified: user_id=4092 [200 OK]"
          ]
        },
        "sound": {
          "typewriterClicks": true,
          "completionChime": true
        },
        "durationSeconds": 8.0
      };

      const SPEC = (typeof window.__INJECTED_SPEC__ !== 'undefined') ? window.__INJECTED_SPEC__ : DEFAULT_SPEC;

      // --- Sound Engine (Zero external audio files) ---
      class AudioSynth {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        click() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(650 + (Math.random() * 80 - 40), this.ctx.currentTime);
            gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.03);
          } catch(e) {}
        }

        chime() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          try {
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.08);
              gain.gain.setValueAtTime(0.08, this.ctx.currentTime + i * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.08 + 0.35);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(this.ctx.currentTime + i * 0.08);
              osc.stop(this.ctx.currentTime + i * 0.08 + 0.35);
            });
          } catch(e) {}
        }
      }

      const audio = new AudioSynth();

      // --- Syntax Highlighter Helpers ---
      function highlightSyntax(line, lang) {
        if (!line) return '';
        // Escape HTML
        let safe = line
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        // Keywords
        const kwRegex = /\b(async|await|function|const|let|var|return|if|else|throw|new|import|from|export|def|class|fn|pub|impl|struct|select|where)\b/g;
        safe = safe.replace(kwRegex, '<span class="kw">$1</span>');

        // Strings
        safe = safe.replace(/(["'`].*?["'`])/g, '<span class="str">$1</span>');

        // Functions
        safe = safe.replace(/\b([a-zA-Z0-9_]+)(?=\()/g, '<span class="fn">$1</span>');

        // Numbers
        safe = safe.replace(/\b(\d+)\b/g, '<span class="num">$1</span>');

        return safe;
      }

      // --- Animation Controller ---
      class MotionController {
        constructor(spec) {
          this.spec = spec;
          this.duration = spec.durationSeconds || 8.0;
          this.currentTime = 0;
          this.isPlaying = true;
          this.lastFrameTime = performance.now();
          this.chimePlayed = false;

          // Flatten characters for progressive typewriter
          this.totalChars = spec.code.reduce((acc, l) => acc + l.length + 1, 0);

          // DOM Elements
          this.viewport = document.getElementById('viewport-frame');
          this.editorBody = document.getElementById('editor-body');
          this.calloutOverlay = document.getElementById('callout-overlay');
          this.terminalDrawer = document.getElementById('terminal-drawer');
          this.terminalLines = document.getElementById('terminal-lines');
          this.scrubber = document.getElementById('scrubber');
          this.timeBadge = document.getElementById('time-badge');
          this.playPauseBtn = document.getElementById('play-pause-btn');

          this.initUI();
          this.setupEvents();
          this.renderFrame(0);
          this.loop = this.loop.bind(this);
          requestAnimationFrame(this.loop);
        }

        initUI() {
          document.body.setAttribute('data-theme', this.spec.theme || 'obsidian');
          document.getElementById('window-title').textContent = this.spec.title;
          document.getElementById('badge-lang').textContent = (this.spec.language || 'code').slice(0, 3).toUpperCase();
          document.getElementById('term-title').textContent = this.spec.terminal?.title || 'Terminal';

          // Set aspect ratio
          if (this.spec.aspectRatio === '16:9') {
            this.viewport.className = 'viewport-frame aspect-16-9';
            document.getElementById('ratio-btn').textContent = '💻 16:9';
          } else {
            this.viewport.className = 'viewport-frame aspect-9-16';
            document.getElementById('ratio-btn').textContent = '📱 9:16';
          }

          // Build code line containers
          this.editorBody.innerHTML = '';
          this.spec.code.forEach((l, idx) => {
            const lineElem = document.createElement('div');
            lineElem.className = 'code-line';
            lineElem.id = `line-${idx + 1}`;
            lineElem.innerHTML = `
              <span class="line-num">${String(idx + 1).padStart(2, '0')}</span>
              <span class="line-text" id="line-text-${idx + 1}"></span>
            `;
            this.editorBody.appendChild(lineElem);
          });

          // Build callout cards
          this.calloutOverlay.innerHTML = '';
          (this.spec.callouts || []).forEach((c, idx) => {
            const card = document.createElement('div');
            card.className = 'callout-card';
            card.id = `callout-${idx}`;
            card.innerHTML = `
              <div class="callout-header">⚡ 0${idx + 1} ${c.label}</div>
              <div class="callout-desc">${c.note}</div>
            `;
            // Position relative to target line
            card.style.top = `${(c.line - 1) * 26 + 18}px`;
            card.style.right = '12px';
            this.calloutOverlay.appendChild(card);
          });

          // Build terminal lines
          this.terminalLines.innerHTML = '';
          (this.spec.terminal?.commands || []).forEach((cmd, idx) => {
            const tLine = document.createElement('div');
            tLine.className = 'term-line';
            tLine.id = `term-line-${idx}`;
            tLine.textContent = cmd;
            this.terminalLines.appendChild(tLine);
          });
        }

        renderFrame(t) {
          this.currentTime = Math.max(0, Math.min(this.duration, t));
          const progress = this.currentTime / this.duration;

          // 1. Typewriter typing phase (0% -> 55% of total time)
          const typingEnd = 0.55;
          const typingProgress = Math.min(1.0, progress / typingEnd);
          const charsToType = Math.floor(typingProgress * this.totalChars);

          let charCounter = 0;
          this.spec.code.forEach((fullLine, idx) => {
            const textElem = document.getElementById(`line-text-${idx + 1}`);
            const lineElem = document.getElementById(`line-${idx + 1}`);
            if (!textElem) return;

            if (charCounter + fullLine.length <= charsToType) {
              // Full line typed
              textElem.innerHTML = highlightSyntax(fullLine, this.spec.language);
              charCounter += fullLine.length + 1;
            } else if (charCounter <= charsToType) {
              // Partial line typed (active cursor)
              const remaining = charsToType - charCounter;
              const partial = fullLine.slice(0, remaining);
              textElem.innerHTML = highlightSyntax(partial, this.spec.language) + '<span class="cursor"></span>';
              charCounter += fullLine.length + 1;
            } else {
              // Not typed yet
              textElem.textContent = '';
            }

            // 2. Focused lines dimming (occurs after typing finishes, > 55%)
            if (progress >= 0.55 && this.spec.focusLines && this.spec.focusLines.length > 0) {
              if (this.spec.focusLines.includes(idx + 1)) {
                lineElem.classList.remove('dimmed');
                lineElem.classList.add('focused');
              } else {
                lineElem.classList.add('dimmed');
                lineElem.classList.remove('focused');
              }
            } else {
              lineElem.classList.remove('dimmed', 'focused');
            }
          });

          // 3. Callouts appearance (60% -> 80%)
          (this.spec.callouts || []).forEach((c, idx) => {
            const card = document.getElementById(`callout-${idx}`);
            if (card) {
              const trigger = 0.60 + (idx * 0.08);
              if (progress >= trigger) {
                card.classList.add('active');
              } else {
                card.classList.remove('active');
              }
            }
          });

          // 4. Terminal drawer slide-in (75% -> 100%)
          if (this.spec.terminal?.enabled) {
            if (progress >= 0.72) {
              this.terminalDrawer.classList.add('open');
              if (!this.chimePlayed && this.spec.sound?.completionChime) {
                audio.chime();
                this.chimePlayed = true;
              }
            } else {
              this.terminalDrawer.classList.remove('open');
              this.chimePlayed = false;
            }

            (this.spec.terminal.commands || []).forEach((_, idx) => {
              const tl = document.getElementById(`term-line-${idx}`);
              if (tl) {
                const termTrigger = 0.75 + (idx * 0.07);
                if (progress >= termTrigger) {
                  tl.classList.add('visible');
                } else {
                  tl.classList.remove('visible');
                }
              }
            });
          }

          // Update Scrubber UI
          this.scrubber.value = (progress * 100).toFixed(1);
          this.timeBadge.textContent = `${this.currentTime.toFixed(1)}s / ${this.duration.toFixed(1)}s`;
        }

        loop(now) {
          const delta = (now - this.lastFrameTime) / 1000;
          this.lastFrameTime = now;

          if (this.isPlaying) {
            this.currentTime += delta;
            if (this.currentTime >= this.duration) {
              this.currentTime = 0; // loop
              this.chimePlayed = false;
            }
            this.renderFrame(this.currentTime);
          }

          requestAnimationFrame(this.loop);
        }

        setupEvents() {
          this.playPauseBtn.addEventListener('click', () => {
            this.isPlaying = !this.isPlaying;
            this.playPauseBtn.textContent = this.isPlaying ? '⏸ Pause' : '▶ Play';
          });

          document.getElementById('restart-btn').addEventListener('click', () => {
            this.currentTime = 0;
            this.chimePlayed = false;
            this.renderFrame(0);
          });

          document.getElementById('ratio-btn').addEventListener('click', () => {
            if (this.viewport.classList.contains('aspect-9-16')) {
              this.viewport.className = 'viewport-frame aspect-16-9';
              document.getElementById('ratio-btn').textContent = '💻 16:9';
            } else {
              this.viewport.className = 'viewport-frame aspect-9-16';
              document.getElementById('ratio-btn').textContent = '📱 9:16';
            }
          });

          this.scrubber.addEventListener('input', (e) => {
            const pct = parseFloat(e.target.value) / 100;
            this.renderFrame(pct * this.duration);
          });

          window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
              e.preventDefault();
              this.isPlaying = !this.isPlaying;
              this.playPauseBtn.textContent = this.isPlaying ? '⏸ Pause' : '▶ Play';
            }
          });
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        window.controller = new MotionController(SPEC);
      });
    })();
  </script>
</body>
</html>
